<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đồng Hồ Đếm Ngược Chuyên Nghiệp</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #e0f2fe;
      --bg-2: #dbeafe;
      --bg-3: #cffafe;
      --bg-4: #e0e7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      min-height: 100vh;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      color: #0f172a;
      overflow-x: hidden;
      background: linear-gradient(125deg, #e0f2fe, #dbeafe, #cffafe, #e0e7ff, #f0f9ff);
      background-size: 400% 400%;
      animation: luxuryBlueShift 16s ease-in-out infinite;
    }

    @keyframes luxuryBlueShift {
      0% { background-position: 0% 50%; }
      25% { background-position: 50% 100%; }
      50% { background-position: 100% 50%; }
      75% { background-position: 50% 0%; }
      100% { background-position: 0% 50%; }
    }

    /* Subtle floating ambient orbs for luxury depth */
    .ambient-orb {
      position: fixed;
      border-radius: 9999px;
      filter: blur(70px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
      animation: orbFloat 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(125, 211, 252, 0.7), rgba(186, 230, 253, 0));
      top: -80px;
      left: -80px;
    }

    .orb-2 {
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, rgba(147, 197, 253, 0.65), rgba(191, 219, 254, 0));
      bottom: -120px;
      right: -100px;
      animation-delay: -6s;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(165, 243, 252, 0.6), rgba(207, 250, 254, 0));
      top: 40%;
      left: 55%;
      animation-delay: -11s;
    }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(28px, -22px) scale(1.08); }
      100% { transform: translate(-20px, 24px) scale(0.96); }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 20px 50px rgba(14, 116, 144, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Synchronized 10 -> 0 countdown digit animation */
    @keyframes syncDigitPop {
      0% {
        transform: scale(0.55);
        opacity: 0.15;
        filter: drop-shadow(0 0 0px rgba(2, 132, 199, 0));
      }
      35% {
        transform: scale(1.16);
        opacity: 1;
        filter: drop-shadow(0 0 24px rgba(14, 165, 233, 0.55));
      }
      100% {
        transform: scale(1);
        opacity: 1;
        filter: drop-shadow(0 6px 16px rgba(15, 23, 42, 0.12));
      }
    }

    .sync-digit-anim {
      animation: syncDigitPop 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes ringPulse {
      0% { filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.3)); }
      50% { filter: drop-shadow(0 0 18px rgba(239, 68, 68, 0.65)); }
      100% { filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.3)); }
    }

    .urgent-ring {
      animation: ringPulse 1s ease-in-out infinite;
    }

    /* Finale zoomed message with continuous color changing */
    @keyframes finaleZoom {
      0% {
        transform: scale(0.25);
        opacity: 0;
      }
      55% {
        transform: scale(1.12);
        opacity: 1;
      }
      75% {
        transform: scale(0.98);
      }
      100% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    @keyframes finaleGentleBreathe {
      0%, 100% { transform: scale(1.02); }
      50% { transform: scale(1.09); }
    }

    @keyframes continuousColorShift {
      0%   { color: #dc2626; text-shadow: 0 4px 28px rgba(220, 38, 38, 0.35), 0 2px 4px rgba(255,255,255,0.9); }
      16%  { color: #d97706; text-shadow: 0 4px 28px rgba(217, 119, 6, 0.35), 0 2px 4px rgba(255,255,255,0.9); }
      33%  { color: #059669; text-shadow: 0 4px 28px rgba(5, 150, 105, 0.35), 0 2px 4px rgba(255,255,255,0.9); }
      50%  { color: #0284c7; text-shadow: 0 4px 28px rgba(2, 132, 199, 0.35), 0 2px 4px rgba(255,255,255,0.9); }
      66%  { color: #7c3aed; text-shadow: 0 4px 28px rgba(124, 58, 237, 0.35), 0 2px 4px rgba(255,255,255,0.9); }
      83%  { color: #db2777; text-shadow: 0 4px 28px rgba(219, 39, 119, 0.35), 0 2px 4px rgba(255,255,255,0.9); }
      100% { color: #dc2626; text-shadow: 0 4px 28px rgba(220, 38, 38, 0.35), 0 2px 4px rgba(255,255,255,0.9); }
    }

    .finale-text-animate {
      animation:
        finaleZoom 1s cubic-bezier(0.16, 1, 0.3, 1) forwards,
        finaleGentleBreathe 2.6s ease-in-out 1s infinite,
        continuousColorShift 2.4s linear infinite;
    }

    /* Fireworks Canvas */
    #fireworksCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 40;
    }

    input, textarea {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    /* Hide number input arrows */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="relative flex flex-col min-h-screen selection:bg-sky-200 selection:text-sky-900">
  <!-- Ambient luxury background orbs -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>

  <!-- Full-screen Fireworks Canvas -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- Header -->
  <header class="relative z-20 w-full max-w-5xl mx-auto px-4 sm:px-6 pt-4 sm:pt-6 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-sky-500 to-blue-600 text-white flex items-center justify-center shadow-lg shadow-sky-500/25">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <circle cx="12" cy="13" r="8"></circle>
          <path stroke-linecap="round" d="M12 9v4l2.5 2.5M9.5 3h5"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-slate-800 leading-tight">
          ĐỒNG HỒ ĐẾM NGƯỢC
        </h1>
        <p class="text-xs text-slate-500 font-medium hidden sm:block">Chuyên nghiệp • Đồng bộ từng giây</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Sound Toggle Button -->
      <button
        id="soundToggleBtn"
        type="button"
        aria-label="Bật hoặc tắt âm thanh"
        class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold glass-card hover:bg-white/90 active:scale-95 transition-all cursor-pointer text-slate-700"
      >
        <span id="soundIconOn">
          <svg class="w-4 h-4 text-sky-600" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"></path>
          </svg>
        </span>
        <span id="soundIconOff" class="hidden">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M23 9l-6 6M17 9l6 6"></path>
          </svg>
        </span>
        <span id="soundLabel">Âm thanh: Bật</span>
      </button>

      <!-- Fullscreen Toggle -->
      <button
        id="fullscreenBtn"
        type="button"
        title="Toàn màn hình"
        class="inline-flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-xl glass-card hover:bg-white/90 active:scale-95 transition-all cursor-pointer text-slate-700"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="relative z-20 flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 py-4 sm:py-6 flex flex-col items-center justify-center gap-5">
    <!-- Timer Display Card -->
    <section class="w-full glass-card rounded-3xl p-5 sm:p-8 flex flex-col items-center justify-center text-center relative overflow-hidden">
      <!-- Status Badge -->
      <div id="statusBadge" class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-sky-100/80 border border-sky-200 text-sky-800 text-xs font-bold uppercase tracking-wider mb-4">
        <span id="statusDot" class="w-2 h-2 rounded-full bg-sky-500"></span>
        <span id="statusText">Sẵn sàng</span>
      </div>

      <!-- Circular Ring + Time Display -->
      <div class="relative flex items-center justify-center w-60 h-60 sm:w-72 sm:h-72 my-1">
        <svg class="w-full h-full -rotate-90" viewBox="0 0 260 260">
          <circle
            cx="130"
            cy="130"
            r="116"
            fill="none"
            stroke="rgba(186, 230, 253, 0.55)"
            stroke-width="12"
          ></circle>
          <circle
            id="progressRing"
            cx="130"
            cy="130"
            r="116"
            fill="none"
            stroke="url(#ringGradient)"
            stroke-width="12"
            stroke-linecap="round"
            stroke-dasharray="728.85"
            stroke-dashoffset="0"
            class="transition-[stroke-dashoffset] duration-300 ease-linear"
          ></circle>
          <defs>
            <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0284c7" />
              <stop offset="50%" stop-color="#2563eb" />
              <stop offset="100%" stop-color="#06b6d4" />
            </linearGradient>
            <linearGradient id="ringUrgentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ef4444" />
              <stop offset="100%" stop-color="#f97316" />
            </linearGradient>
          </defs>
        </svg>

        <!-- Inner Time / 10->0 Sync Display -->
        <div class="absolute inset-0 flex flex-col items-center justify-center px-4">
          <div
            id="timeDisplay"
            class="tabular-nums font-black tracking-tight text-slate-800 select-none leading-none text-5xl sm:text-6xl"
          >
            00:10
          </div>
          <div id="syncSubLabel" class="mt-2 text-xs sm:text-sm font-semibold text-sky-700/80 min-h-[1.25rem]">
            Nhấn Bắt đầu để đếm ngược
          </div>
        </div>
      </div>

      <!-- Primary Control Buttons -->
      <div class="mt-5 flex flex-wrap items-center justify-center gap-3">
        <button
          id="startBtn"
          type="button"
          class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-bold text-sm sm:text-base shadow-lg shadow-sky-500/30 active:scale-95 transition-all cursor-pointer"
        >
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"></path>
          </svg>
          <span id="startBtnText">Bắt đầu</span>
        </button>

        <button
          id="pauseBtn"
          type="button"
          disabled
          class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-amber-500 hover:bg-amber-600 disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none text-white font-bold text-sm sm:text-base shadow-lg shadow-amber-500/25 active:scale-95 transition-all cursor-pointer disabled:cursor-not-allowed"
        >
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
          </svg>
          <span>Tạm dừng</span>
        </button>

        <button
          id="resetBtn"
          type="button"
          class="inline-flex items-center gap-2 px-5 py-3 rounded-2xl bg-white/80 hover:bg-white text-slate-700 border border-slate-200/80 font-semibold text-sm sm:text-base shadow-sm active:scale-95 transition-all cursor-pointer"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v5h5"></path>
          </svg>
          <span>Đặt lại</span>
        </button>
      </div>
    </section>

    <!-- Settings Grid: Duration & Saved Message -->
    <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
      <!-- Duration Setup Card -->
      <section class="glass-card rounded-3xl p-5 sm:p-6 flex flex-col justify-between gap-4">
        <div>
          <h2 class="text-sm font-bold uppercase tracking-wider text-slate-600 flex items-center gap-2 mb-3">
            <svg class="w-4 h-4 text-sky-600" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <path stroke-linecap="round" d="M12 7v5l3 2"></path>
            </svg>
            Cài đặt thời gian
          </h2>

          <!-- Custom H : M : S Inputs -->
          <div class="grid grid-cols-3 gap-2.5">
            <div class="bg-white/75 border border-sky-100 rounded-2xl p-2.5 text-center">
              <label for="hoursInput" class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Giờ</label>
              <input
                id="hoursInput"
                type="number"
                min="0"
                max="99"
                value="0"
                class="w-full text-center text-2xl font-extrabold text-slate-800 bg-transparent focus:outline-none tabular-nums"
              />
            </div>
            <div class="bg-white/75 border border-sky-100 rounded-2xl p-2.5 text-center">
              <label for="minutesInput" class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Phút</label>
              <input
                id="minutesInput"
                type="number"
                min="0"
                max="59"
                value="0"
                class="w-full text-center text-2xl font-extrabold text-slate-800 bg-transparent focus:outline-none tabular-nums"
              />
            </div>
            <div class="bg-white/75 border border-sky-100 rounded-2xl p-2.5 text-center">
              <label for="secondsInput" class="block text-[11px] font-bold uppercase text-slate-400 mb-1">Giây</label>
              <input
                id="secondsInput"
                type="number"
                min="0"
                max="59"
                value="10"
                class="w-full text-center text-2xl font-extrabold text-slate-800 bg-transparent focus:outline-none tabular-nums"
              />
            </div>
          </div>
        </div>

        <!-- Quick Presets -->
        <div>
          <p class="text-xs font-semibold text-slate-500 mb-2">Chọn nhanh:</p>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-preset="10" class="preset-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-sky-100/90 hover:bg-sky-200 text-sky-800 transition cursor-pointer">10 giây</button>
            <button type="button" data-preset="30" class="preset-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white/80 hover:bg-sky-100 text-slate-700 border border-slate-200/70 transition cursor-pointer">30 giây</button>
            <button type="button" data-preset="60" class="preset-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white/80 hover:bg-sky-100 text-slate-700 border border-slate-200/70 transition cursor-pointer">1 phút</button>
            <button type="button" data-preset="180" class="preset-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white/80 hover:bg-sky-100 text-slate-700 border border-slate-200/70 transition cursor-pointer">3 phút</button>
            <button type="button" data-preset="300" class="preset-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white/80 hover:bg-sky-100 text-slate-700 border border-slate-200/70 transition cursor-pointer">5 phút</button>
            <button type="button" data-preset="600" class="preset-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white/80 hover:bg-sky-100 text-slate-700 border border-slate-200/70 transition cursor-pointer">10 phút</button>
            <button type="button" data-preset="900" class="preset-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-white/80 hover:bg-sky-100 text-slate-700 border border-slate-200/70 transition cursor-pointer">15 phút</button>
          </div>
        </div>
      </section>

      <!-- Message Setup & Persistence Card (Requirement 1) -->
      <section class="glass-card rounded-3xl p-5 sm:p-6 flex flex-col justify-between gap-4">
        <div>
          <div class="flex items-center justify-between gap-2 mb-3">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-600 flex items-center gap-2">
              <svg class="w-4 h-4 text-sky-600" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h6m-8 8l4-4h10a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
              Nội dung khi hết giờ
            </h2>
            <span id="saveIndicator" class="text-[11px] font-semibold text-emerald-600 opacity-0 transition-opacity duration-300">
              Đã tự động lưu
            </span>
          </div>

          <div class="flex gap-2">
            <input
              id="messageInput"
              type="text"
              maxlength="200"
              placeholder="Nhập dòng chữ hiển thị khi hết giờ..."
              class="flex-1 px-3.5 py-2.5 rounded-xl bg-white/85 border border-sky-200 focus:border-sky-500 focus:ring-2 focus:ring-sky-200 focus:outline-none text-sm font-semibold text-slate-800 placeholder:text-slate-400"
            />
            <button
              id="savePresetMsgBtn"
              type="button"
              title="Lưu vào danh sách dùng cho lần sau"
              class="px-3.5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow-sm active:scale-95 transition cursor-pointer whitespace-nowrap"
            >
              + Lưu mẫu
            </button>
          </div>
        </div>

        <div>
          <p class="text-xs font-semibold text-slate-500 mb-2">Nội dung đã lưu cho những lần sau:</p>
          <div id="savedMessagesList" class="flex flex-wrap gap-2 max-h-24 overflow-y-auto pr-1"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- Finale Fullscreen Message Overlay -->
  <div
    id="finaleOverlay"
    class="fixed inset-0 z-30 hidden flex-col items-center justify-center p-6 text-center bg-sky-50/45 backdrop-blur-md"
  >
    <div class="max-w-5xl w-full flex flex-col items-center justify-center gap-8">
      <div
        id="finaleMessageText"
        class="font-black uppercase tracking-tight leading-tight text-4xl sm:text-6xl md:text-7xl lg:text-8xl break-words px-4 select-none"
      >
        HẾT GIỜ!
      </div>

      <button
        id="closeFinaleBtn"
        type="button"
        class="mt-4 inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-white/90 hover:bg-white text-slate-800 font-bold text-sm sm:text-base shadow-xl border border-sky-200 active:scale-95 transition-all cursor-pointer z-50"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"></path>
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v5h5"></path>
        </svg>
        <span>Quay lại đồng hồ</span>
      </button>
    </div>
  </div>

  <script>
    (function () {
      // --- Storage Keys ---
      const STORAGE_KEYS = {
        CURRENT_MSG: 'pro_timer_current_message_v2',
        SAVED_MSGS: 'pro_timer_saved_messages_v2',
        DURATION: 'pro_timer_duration_v1',
        SOUND: 'pro_timer_sound_v1'
      };

      const DEFAULT_MESSAGES = [
        'CHÀO MỪNG QUÝ THẦY CÔ DỰ GIỜ THAO GIẢNG LỚP 12A1 - TRƯỜNG THPT NGUYỄN THÁI BÌNH',
        'HẾT GIỜ LÀM BÀI!',
        'CHÚC MỪNG HOÀN THÀNH!',
        'BẮT ĐẦU TIẾT HỌC MỚI!'
      ];

      function safeGet(key, fallback) {
        try {
          const val = localStorage.getItem(key);
          return val !== null ? JSON.parse(val) : fallback;
        } catch (e) {
          return fallback;
        }
      }

      function safeSet(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch (e) {
          // Ignore storage errors in restricted environments
        }
      }

      // --- DOM Elements ---
      const timeDisplay = document.getElementById('timeDisplay');
      const syncSubLabel = document.getElementById('syncSubLabel');
      const progressRing = document.getElementById('progressRing');
      const statusBadge = document.getElementById('statusBadge');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      const startBtn = document.getElementById('startBtn');
      const startBtnText = document.getElementById('startBtnText');
      const pauseBtn = document.getElementById('pauseBtn');
      const resetBtn = document.getElementById('resetBtn');

      const soundToggleBtn = document.getElementById('soundToggleBtn');
      const soundIconOn = document.getElementById('soundIconOn');
      const soundIconOff = document.getElementById('soundIconOff');
      const soundLabel = document.getElementById('soundLabel');
      const fullscreenBtn = document.getElementById('fullscreenBtn');

      const hoursInput = document.getElementById('hoursInput');
      const minutesInput = document.getElementById('minutesInput');
      const secondsInput = document.getElementById('secondsInput');
      const presetBtns = document.querySelectorAll('.preset-btn');

      const messageInput = document.getElementById('messageInput');
      const savePresetMsgBtn = document.getElementById('savePresetMsgBtn');
      const savedMessagesList = document.getElementById('savedMessagesList');
      const saveIndicator = document.getElementById('saveIndicator');

      const finaleOverlay = document.getElementById('finaleOverlay');
      const finaleMessageText = document.getElementById('finaleMessageText');
      const closeFinaleBtn = document.getElementById('closeFinaleBtn');
      const fireworksCanvas = document.getElementById('fireworksCanvas');
      const fwCtx = fireworksCanvas.getContext('2d');

      // --- App State ---
      const RING_CIRCUMFERENCE = 2 * Math.PI * 116; // ~728.85
      let totalSeconds = safeGet(STORAGE_KEYS.DURATION, 10);
      if (typeof totalSeconds !== 'number' || totalSeconds <= 0) totalSeconds = 10;

      let remainingSeconds = totalSeconds;
      let isRunning = false;
      let isPaused = false;
      let timerInterval = null;
      let endTimeMs = 0;
      let lastRenderedSecond = -1;

      let soundEnabled = safeGet(STORAGE_KEYS.SOUND, true);
      let currentMessage = safeGet(STORAGE_KEYS.CURRENT_MSG, DEFAULT_MESSAGES[0]);
      let savedMessages = safeGet(STORAGE_KEYS.SAVED_MSGS, DEFAULT_MESSAGES.slice());
      if (!Array.isArray(savedMessages) || savedMessages.length === 0) {
        savedMessages = DEFAULT_MESSAGES.slice();
      }

      // --- Web Audio API Synthesizer ---
      let audioCtx = null;
      function ensureAudioCtx() {
        if (!soundEnabled) return null;
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playTickSound(isUrgent, sec) {
        const ctx = ensureAudioCtx();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (isUrgent) {
          // Crisp, rising pitch tone for 10 -> 0 synchronized countdown
          osc.type = 'triangle';
          const freq = sec === 0 ? 1046.5 : 520 + (10 - sec) * 38;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.24, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        } else {
          // Subtle soft tick for normal seconds
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.045, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      }

      function playFinaleFanfare() {
        const ctx = ensureAudioCtx();
        if (!ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const now = ctx.currentTime + idx * 0.11;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.26, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.58);
        });
      }

      function playFireworkPop() {
        const ctx = ensureAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180 + Math.random() * 140, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.16);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.19);
      }

      // --- Formatting & Display ---
      function formatTime(sec) {
        const s = Math.max(0, Math.floor(sec));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const remS = s % 60;
        const pad = (n) => String(n).padStart(2, '0');
        if (h > 0) {
          return `${pad(h)}:${pad(m)}:${pad(remS)}`;
        }
        return `${pad(m)}:${pad(remS)}`;
      }

      function syncInputsFromTotal(sec) {
        const s = Math.max(0, Math.floor(sec));
        hoursInput.value = Math.floor(s / 3600);
        minutesInput.value = Math.floor((s % 3600) / 60);
        secondsInput.value = s % 60;
      }

      function triggerDigitSyncAnimation() {
        timeDisplay.classList.remove('sync-digit-anim');
        void timeDisplay.offsetWidth; // Force reflow so animation restarts synchronously
        timeDisplay.classList.add('sync-digit-anim');
      }

      function updateDisplay(isTick) {
        const progress = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
        const offset = RING_CIRCUMFERENCE * (1 - progress);
        progressRing.style.strokeDasharray = `${RING_CIRCUMFERENCE}`;
        progressRing.style.strokeDashoffset = `${offset}`;

        const inFinalTen = isRunning && remainingSeconds <= 10 && remainingSeconds >= 0;

        if (inFinalTen) {
          timeDisplay.textContent = String(remainingSeconds);
          timeDisplay.classList.remove('text-5xl', 'sm:text-6xl', 'text-slate-800');
          timeDisplay.classList.add('text-7xl', 'sm:text-8xl', 'text-rose-600');
          progressRing.setAttribute('stroke', 'url(#ringUrgentGradient)');
          progressRing.classList.add('urgent-ring');
          syncSubLabel.textContent = remainingSeconds === 0 ? 'Hết giờ!' : `Đếm ngược đồng bộ: ${remainingSeconds}`;
          if (isTick) {
            triggerDigitSyncAnimation();
          }
        } else {
          timeDisplay.textContent = formatTime(remainingSeconds);
          timeDisplay.classList.remove('text-7xl', 'sm:text-8xl', 'text-rose-600', 'sync-digit-anim');
          timeDisplay.classList.add('text-5xl', 'sm:text-6xl', 'text-slate-800');
          progressRing.setAttribute('stroke', 'url(#ringGradient)');
          progressRing.classList.remove('urgent-ring');

          if (isRunning) {
            syncSubLabel.textContent = 'Đang đếm ngược...';
          } else if (isPaused) {
            syncSubLabel.textContent = 'Đã tạm dừng';
          } else {
            syncSubLabel.textContent = 'Nhấn Bắt đầu để đếm ngược';
          }
        }
      }

      function updateControlsUI() {
        if (isRunning) {
          startBtn.disabled = true;
          startBtn.classList.add('opacity-50', 'cursor-not-allowed');
          startBtnText.textContent = 'Đang chạy';
          pauseBtn.disabled = false;

          statusBadge.className = 'inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-emerald-100/90 border border-emerald-200 text-emerald-800 text-xs font-bold uppercase tracking-wider mb-4';
          statusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-ping';
          statusText.textContent = 'Đang đếm ngược';
        } else if (isPaused) {
          startBtn.disabled = false;
          startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          startBtnText.textContent = 'Tiếp tục';
          pauseBtn.disabled = true;

          statusBadge.className = 'inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-100/90 border border-amber-200 text-amber-800 text-xs font-bold uppercase tracking-wider mb-4';
          statusDot.className = 'w-2 h-2 rounded-full bg-amber-500';
          statusText.textContent = 'Tạm dừng';
        } else {
          startBtn.disabled = false;
          startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          startBtnText.textContent = 'Bắt đầu';
          pauseBtn.disabled = true;

          statusBadge.className = 'inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-sky-100/80 border border-sky-200 text-sky-800 text-xs font-bold uppercase tracking-wider mb-4';
          statusDot.className = 'w-2 h-2 rounded-full bg-sky-500';
          statusText.textContent = 'Sẵn sàng';
        }
      }

      // --- Sound UI ---
      function updateSoundUI() {
        if (soundEnabled) {
          soundIconOn.classList.remove('hidden');
          soundIconOff.classList.add('hidden');
          soundLabel.textContent = 'Âm thanh: Bật';
        } else {
          soundIconOn.classList.add('hidden');
          soundIconOff.classList.remove('hidden');
          soundLabel.textContent = 'Âm thanh: Tắt';
        }
      }

      soundToggleBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        safeSet(STORAGE_KEYS.SOUND, soundEnabled);
        updateSoundUI();
        if (soundEnabled) {
          ensureAudioCtx();
          playTickSound(false, 11);
        }
      });

      // --- Fullscreen ---
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(() => {});
        } else {
          document.exitFullscreen?.().catch(() => {});
        }
      });

      // --- Saved Messages Management ---
      let saveTimeout = null;
      function flashSavedIndicator() {
        saveIndicator.classList.remove('opacity-0');
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          saveIndicator.classList.add('opacity-0');
        }, 1500);
      }

      function renderSavedMessages() {
        savedMessagesList.innerHTML = '';
        savedMessages.forEach((msg, index) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'inline-flex items-center gap-1 bg-white/85 hover:bg-sky-50 border border-sky-200/80 rounded-xl pl-2.5 pr-1.5 py-1 text-xs font-semibold text-slate-700 shadow-sm transition';

          const selectBtn = document.createElement('button');
          selectBtn.type = 'button';
          selectBtn.textContent = msg;
          selectBtn.className = 'cursor-pointer hover:text-sky-700 text-left max-w-[180px] truncate';
          selectBtn.title = msg;
          selectBtn.addEventListener('click', () => {
            currentMessage = msg;
            messageInput.value = msg;
            safeSet(STORAGE_KEYS.CURRENT_MSG, currentMessage);
            flashSavedIndicator();
          });

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.innerHTML = '&times;';
          delBtn.title = 'Xóa mẫu này';
          delBtn.className = 'w-4 h-4 rounded-full flex items-center justify-center text-slate-400 hover:text-rose-600 hover:bg-rose-50 cursor-pointer font-bold leading-none';
          delBtn.addEventListener('click', () => {
            savedMessages.splice(index, 1);
            safeSet(STORAGE_KEYS.SAVED_MSGS, savedMessages);
            renderSavedMessages();
          });

          wrapper.appendChild(selectBtn);
          wrapper.appendChild(delBtn);
          savedMessagesList.appendChild(wrapper);
        });
      }

      messageInput.addEventListener('input', () => {
        currentMessage = messageInput.value;
        safeSet(STORAGE_KEYS.CURRENT_MSG, currentMessage);
        flashSavedIndicator();
      });

      savePresetMsgBtn.addEventListener('click', () => {
        const trimmed = messageInput.value.trim();
        if (!trimmed) return;
        currentMessage = trimmed;
        safeSet(STORAGE_KEYS.CURRENT_MSG, currentMessage);
        if (!savedMessages.includes(trimmed)) {
          savedMessages.unshift(trimmed);
          if (savedMessages.length > 12) savedMessages.pop();
          safeSet(STORAGE_KEYS.SAVED_MSGS, savedMessages);
          renderSavedMessages();
        }
        flashSavedIndicator();
      });

      // --- Duration Inputs & Presets ---
      function applyInputsToTimer() {
        if (isRunning) return;
        const h = Math.max(0, Math.min(99, parseInt(hoursInput.value, 10) || 0));
        const m = Math.max(0, Math.min(59, parseInt(minutesInput.value, 10) || 0));
        const s = Math.max(0, Math.min(59, parseInt(secondsInput.value, 10) || 0));
        const computed = h * 3600 + m * 60 + s;
        totalSeconds = computed > 0 ? computed : 10;
        remainingSeconds = totalSeconds;
        isPaused = false;
        safeSet(STORAGE_KEYS.DURATION, totalSeconds);
        updateDisplay(false);
        updateControlsUI();
      }

      [hoursInput, minutesInput, secondsInput].forEach((inp) => {
        inp.addEventListener('change', () => {
          syncInputsFromTotal(
            (parseInt(hoursInput.value, 10) || 0) * 3600 +
            (parseInt(minutesInput.value, 10) || 0) * 60 +
            (parseInt(secondsInput.value, 10) || 0)
          );
          applyInputsToTimer();
        });
      });

      presetBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          stopTimerInterval();
          stopFireworks();
          finaleOverlay.classList.add('hidden');
          finaleOverlay.classList.remove('flex');
          const sec = parseInt(btn.dataset.preset, 10) || 10;
          totalSeconds = sec;
          remainingSeconds = sec;
          isRunning = false;
          isPaused = false;
          syncInputsFromTotal(sec);
          safeSet(STORAGE_KEYS.DURATION, totalSeconds);
          updateDisplay(false);
          updateControlsUI();
        });
      });

      // --- Fireworks Engine (Full Screen) ---
      let fwParticles = [];
      let fwRockets = [];
      let fwAnimId = null;
      let fwSpawnInterval = null;
      let fwRunning = false;

      const FIREWORK_COLORS = [
        '#ef4444', '#f97316', '#eab308', '#10b981',
        '#06b6d4', '#2563eb', '#8b5cf6', '#ec4899'
      ];

      function resizeFireworksCanvas() {
        fireworksCanvas.width = window.innerWidth;
        fireworksCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeFireworksCanvas);
      resizeFireworksCanvas();

      function createExplosion(x, y) {
        const count = 58 + Math.floor(Math.random() * 28);
        const baseColor = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
        const altColor = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];

        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.15;
          const speed = 2.2 + Math.random() * 5.8;
          fwParticles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: 2.2 + Math.random() * 2.5,
            color: i % 3 === 0 ? altColor : baseColor,
            alpha: 1,
            decay: 0.012 + Math.random() * 0.012,
            gravity: 0.055
          });
        }
        if (Math.random() < 0.6) {
          playFireworkPop();
        }
      }

      function launchRocket() {
        const w = fireworksCanvas.width;
        const h = fireworksCanvas.height;
        const startX = w * (0.1 + Math.random() * 0.8);
        const targetY = h * (0.12 + Math.random() * 0.48);
        fwRockets.push({
          x: startX,
          y: h + 10,
          vx: (Math.random() - 0.5) * 2.2,
          vy: -(9.5 + Math.random() * 4.5),
          targetY,
          color: FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)]
        });
      }

      function renderFireworksLoop() {
        if (!fwRunning) return;
        fwCtx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

        // Update rockets
        for (let i = fwRockets.length - 1; i >= 0; i--) {
          const r = fwRockets[i];
          r.x += r.vx;
          r.y += r.vy;
          r.vy += 0.12;

          fwCtx.beginPath();
          fwCtx.arc(r.x, r.y, 3.2, 0, Math.PI * 2);
          fwCtx.fillStyle = r.color;
          fwCtx.fill();

          if (r.y <= r.targetY || r.vy >= 0) {
            createExplosion(r.x, r.y);
            fwRockets.splice(i, 1);
          }
        }

        // Update particles
        for (let i = fwParticles.length - 1; i >= 0; i--) {
          const p = fwParticles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.vx *= 0.985;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            fwParticles.splice(i, 1);
            continue;
          }

          fwCtx.save();
          fwCtx.globalAlpha = p.alpha;
          fwCtx.beginPath();
          fwCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          fwCtx.fillStyle = p.color;
          fwCtx.shadowColor = p.color;
          fwCtx.shadowBlur = 10;
          fwCtx.fill();
          fwCtx.restore();
        }

        fwAnimId = requestAnimationFrame(renderFireworksLoop);
      }

      function startFireworks() {
        stopFireworks();
        resizeFireworksCanvas();
        fwRunning = true;
        // Immediate multi-burst across the screen
        createExplosion(window.innerWidth * 0.25, window.innerHeight * 0.3);
        createExplosion(window.innerWidth * 0.75, window.innerHeight * 0.28);
        createExplosion(window.innerWidth * 0.5, window.innerHeight * 0.22);

        fwSpawnInterval = setInterval(() => {
          launchRocket();
          if (Math.random() < 0.65) launchRocket();
        }, 420);

        renderFireworksLoop();
      }

      function stopFireworks() {
        fwRunning = false;
        clearInterval(fwSpawnInterval);
        fwSpawnInterval = null;
        if (fwAnimId) {
          cancelAnimationFrame(fwAnimId);
          fwAnimId = null;
        }
        fwParticles = [];
        fwRockets = [];
        fwCtx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
      }

      // --- Countdown Engine ---
      function stopTimerInterval() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function triggerFinale() {
        stopTimerInterval();
        isRunning = false;
        isPaused = false;
        remainingSeconds = 0;
        updateDisplay(true);
        updateControlsUI();

        const finalText = (messageInput.value || currentMessage || 'HẾT GIỜ!').trim() || 'HẾT GIỜ!';
        finaleMessageText.textContent = finalText;
        finaleMessageText.classList.remove('finale-text-animate');
        void finaleMessageText.offsetWidth;
        finaleMessageText.classList.add('finale-text-animate');

        finaleOverlay.classList.remove('hidden');
        finaleOverlay.classList.add('flex');

        playFinaleFanfare();
        startFireworks();
      }

      function startCountdown() {
        ensureAudioCtx();
        if (isRunning) return;

        if (!isPaused && remainingSeconds <= 0) {
          applyInputsToTimer();
        }

        isRunning = true;
        isPaused = false;
        endTimeMs = Date.now() + remainingSeconds * 1000;
        lastRenderedSecond = remainingSeconds;

        updateDisplay(remainingSeconds <= 10);
        updateControlsUI();
        if (remainingSeconds <= 10) {
          playTickSound(true, remainingSeconds);
        }

        stopTimerInterval();
        timerInterval = setInterval(() => {
          const diffMs = endTimeMs - Date.now();
          const newSec = Math.max(0, Math.ceil(diffMs / 1000));

          if (newSec !== lastRenderedSecond) {
            lastRenderedSecond = newSec;
            remainingSeconds = newSec;

            if (newSec <= 0) {
              triggerFinale();
              return;
            }

            const isUrgent = newSec <= 10;
            updateDisplay(true);
            playTickSound(isUrgent, newSec);
          }
        }, 80);
      }

      function pauseCountdown() {
        if (!isRunning) return;
        stopTimerInterval();
        isRunning = false;
        isPaused = true;
        updateDisplay(false);
        updateControlsUI();
      }

      function resetCountdown() {
        stopTimerInterval();
        stopFireworks();
        finaleOverlay.classList.add('hidden');
        finaleOverlay.classList.remove('flex');
        isRunning = false;
        isPaused = false;
        applyInputsToTimer();
      }

      startBtn.addEventListener('click', startCountdown);
      pauseBtn.addEventListener('click', pauseCountdown);
      resetBtn.addEventListener('click', resetCountdown);
      closeFinaleBtn.addEventListener('click', resetCountdown);

      // --- Anti-Copy Protection for GitHub Pages ---
      function isEditableTarget(el) {
        if (!el) return false;
        const tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
      }

      document.addEventListener('contextmenu', (e) => {
        if (!isEditableTarget(e.target)) {
          e.preventDefault();
        }
      });

      document.addEventListener('dragstart', (e) => {
        e.preventDefault();
      });

      document.addEventListener('copy', (e) => {
        if (!isEditableTarget(e.target)) {
          e.preventDefault();
        }
      });

      document.addEventListener('keydown', (e) => {
        const key = (e.key || '').toLowerCase();
        const ctrlOrCmd = e.ctrlKey || e.metaKey;

        // Block F12
        if (e.key === 'F12') {
          e.preventDefault();
          return;
        }
        // Block DevTools (Ctrl/Cmd + Shift + I/J/C)
        if (ctrlOrCmd && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) {
          e.preventDefault();
          return;
        }
        // Block View Source (Ctrl/Cmd + U) & Save Page (Ctrl/Cmd + S)
        if (ctrlOrCmd && (key === 'u' || key === 's')) {
          e.preventDefault();
          return;
        }
        // Block Copy/Cut outside editable inputs
        if (ctrlOrCmd && (key === 'c' || key === 'x') && !isEditableTarget(e.target)) {
          e.preventDefault();
        }
      });

      // --- Initialize UI ---
      messageInput.value = currentMessage;
      syncInputsFromTotal(totalSeconds);
      updateSoundUI();
      renderSavedMessages();
      updateDisplay(false);
      updateControlsUI();
    })();
  </script>
</body>
</html>
